name: Build Psych Engine Web (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - "Project.xml"
      - "source/**"
      - "assets/**"
      - ".github/workflows/build-webport.yml"

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.6"

      - name: Install legacy library required by Lime webify
        run: |
          sudo apt-get update
          curl -fL --retry 3 -o /tmp/libffi6.deb https://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi6_3.2.1-8_amd64.deb
          sudo dpkg -i /tmp/libffi6.deb
          ldconfig -p | grep libffi.so.6

      - name: Configure Haxe libraries
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install web build dependencies
        run: |
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-tools 1.5.1 --quiet
          haxelib install hscript-iris 1.1.3 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install hxdiscord_rpc 1.2.4 --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib run lime setup -y

      - name: Find thread API usage
        run: |
          echo "Searching project source for sys.thread usage..."
          grep -RInE 'sys\\.thread|Thread\\.(create|current|wait|yield)' source Project.xml 2>/dev/null | head -100 || true
          echo "Searching installed Haxe libraries for thread usage..."
          grep -RInE 'sys\\.thread\\.Thread|sys\\.thread\\.Mutex' "$HOME/haxelib" 2>/dev/null | head -100 || true

      - name: Compile HTML5 (verbose diagnostic attempt)
        run: haxelib run lime build html5 -release -v

      - name: Upload HTML5 build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psych-engine-html5-experimental
          path: export/release/html5/bin/
          if-no-files-found: error
          retention-days: 7
