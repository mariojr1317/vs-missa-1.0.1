# Deploy the WebPort ZIP from the release instead of the Windows source tree.
name: Deploy Psych Engine WebPort to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar ZIP del WebPort
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/mariojr1317/vs-missa-1.0.1/releases/download/Psych-Engine-1.0.1/PsychEngine.v1.0.1.zip" \
            -o /tmp/psychengine-webport.zip
          mkdir -p /tmp/webport
          unzip -q /tmp/psychengine-webport.zip -d /tmp/webport

          INDEX_PATH="$(find /tmp/webport -type f -name index.html -print -quit)"
          if [[ -z "$INDEX_PATH" ]]; then
            echo "::error::El ZIP no contiene index.html; no se publicará una página vacía."
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_PATH")"
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -a "$WEB_ROOT"/. "$GITHUB_WORKSPACE/_site"/

          echo "Entrada web encontrada: $INDEX_PATH"
          echo "Archivos preparados: $(find "$GITHUB_WORKSPACE/_site" -type f | wc -l)"
          du -sh "$GITHUB_WORKSPACE/_site"
          test -f "$GITHUB_WORKSPACE/_site/index.html"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el WebPort como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar WebPort
        id: deployment
        uses: actions/deploy-pages@v5
